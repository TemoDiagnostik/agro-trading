name: Security baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# This workflow never deploys the site and never receives account secrets.
permissions:
  contents: read

concurrency:
  group: security-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-baseline:
    name: security-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Test the security checks
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Check tracked source and public data boundaries
        run: python3 .github/scripts/security_check.py
